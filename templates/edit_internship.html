{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header bg-warning">

                <h4>Edit Internship</h4>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label>Student</label>

                        <select
                            name="student_id"
                            class="form-control"
                            required>

                            {% for student in students %}

                            <option
                                value="{{ student.id }}"
                                {% if student.id == internship.student_id %}
                                selected
                                {% endif %}>

                                {{ student.usn }} -
                                {{ student.name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="mb-3">

                        <label>Company Name</label>

                        <input
                            type="text"
                            name="company_name"
                            class="form-control"
                            value="{{ internship.company_name }}"
                            required>

                    </div>


                    <div class="mb-3">

                        <label>Internship Title</label>

                        <input
                            type="text"
                            name="internship_title"
                            class="form-control"
                            value="{{ internship.internship_title }}"
                            required>

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label>Start Date</label>

                            <input
                                type="date"
                                name="start_date"
                                class="form-control"
                                value="{{ internship.start_date }}"
                                required>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label>End Date</label>

                            <input
                                type="date"
                                name="end_date"
                                class="form-control"
                                value="{{ internship.end_date }}"
                                required>

                        </div>

                    </div>


                    <div class="mb-3">

                        <label>Mode</label>

                        <select
                            name="mode"
                            class="form-control"
                            required>

                            <option value="Offline"
                                {% if internship.mode == "Offline" %}selected{% endif %}>
                                Offline
                            </option>

                            <option value="Online"
                                {% if internship.mode == "Online" %}selected{% endif %}>
                                Online
                            </option>

                            <option value="Hybrid"
                                {% if internship.mode == "Hybrid" %}selected{% endif %}>
                                Hybrid
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label>Status</label>

                        <select
                            name="status"
                            class="form-control"
                            required>

                            <option value="Planned"
                                {% if internship.status == "Planned" %}selected{% endif %}>
                                Planned
                            </option>

                            <option value="Ongoing"
                                {% if internship.status == "Ongoing" %}selected{% endif %}>
                                Ongoing
                            </option>

                            <option value="Completed"
                                {% if internship.status == "Completed" %}selected{% endif %}>
                                Completed
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label>Description</label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="4">{{ internship.description }}</textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-success">

                        Update Internship

                    </button>


                    <a
                        href="/internships"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
