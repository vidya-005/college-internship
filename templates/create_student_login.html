<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Student Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Create Student Login</h4>
        </div>

        <div class="card-body">

            <div class="mb-3">
                <strong>Student Name:</strong>
                {{ student.name }}
            </div>

            <div class="mb-3">
                <strong>USN:</strong>
                {{ student.usn }}
            </div>

            <div class="mb-3">
                <strong>Email:</strong>
                {{ student.email }}
            </div>

            <hr>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        value="{{ student.usn }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-success"
                >
                    Create Login
                </button>

                <a
                    href="{{ url_for('students') }}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
