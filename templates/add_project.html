{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h4>Add Project</h4>

            </div>

            <div class="card-body">

                <form method="POST">


                    <div class="mb-3">

                        <label>Student</label>

                        <select
                            name="student_id"
                            class="form-control"
                            required>

                            <option value="">
                                Select Student
                            </option>

                            {% for student in students %}

                            <option value="{{ student.id }}">

                                {{ student.usn }} -
                                {{ student.name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="mb-3">

                        <label>Project Title</label>

                        <input
                            type="text"
                            name="project_title"
                            class="form-control"
                            placeholder="Example: College Internship Management System"
                            required>

                    </div>


                    <div class="mb-3">

                        <label>Project Type</label>

                        <select
                            name="project_type"
                            class="form-control"
                            required>

                            <option value="Mini Project">
                                Mini Project
                            </option>

                            <option value="Major Project">
                                Major Project
                            </option>

                            <option value="Internship Project">
                                Internship Project
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label>Technology</label>

                        <input
                            type="text"
                            name="technology"
                            class="form-control"
                            placeholder="Example: Python, Flask, MySQL, HTML, CSS"
                            required>

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label>Start Date</label>

                            <input
                                type="date"
                                name="start_date"
                                class="form-control">

                        </div>


                        <div class="col-md-6 mb-3">

                            <label>End Date</label>

                            <input
                                type="date"
                                name="end_date"
                                class="form-control">

                        </div>

                    </div>


                    <div class="mb-3">

                        <label>Status</label>

                        <select
                            name="status"
                            class="form-control"
                            required>

                            <option value="Planned">
                                Planned
                            </option>

                            <option value="Ongoing">
                                Ongoing
                            </option>

                            <option value="Completed">
                                Completed
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label>GitHub Repository Link</label>

                        <input
                            type="url"
                            name="github_link"
                            class="form-control"
                            placeholder="https://github.com/username/project">

                    </div>


                    <div class="mb-3">

                        <label>Project Description</label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="5"
                            placeholder="Enter project description"></textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-success">

                        Save Project

                    </button>


                    <a
                        href="/projects"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
