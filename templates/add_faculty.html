{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h4>Add Faculty</h4>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label>Faculty ID</label>

                        <input
                            type="text"
                            name="faculty_id"
                            class="form-control"
                            placeholder="FAC001"
                            required>

                    </div>


                    <div class="mb-3">

                        <label>Faculty Name</label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-3">

                        <label>Email</label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-3">

                        <label>Phone</label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-3">

                        <label>Department</label>

                        <input
                            type="text"
                            name="department"
                            value="BCA"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-3">

                        <label>Designation</label>

                        <select
                            name="designation"
                            class="form-control"
                            required>

                            <option value="Lecturer">
                                Lecturer
                            </option>

                            <option value="Assistant Professor">
                                Assistant Professor
                            </option>

                            <option value="Associate Professor">
                                Associate Professor
                            </option>

                            <option value="Professor">
                                Professor
                            </option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-success">

                        Save Faculty

                    </button>


                    <a
                        href="/faculty"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
