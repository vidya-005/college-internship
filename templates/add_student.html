{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h4>Add Student</h4>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label>USN</label>

                        <input
                            type="text"
                            name="usn"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-3">

                        <label>Student Name</label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-3">

                        <label>Email</label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-3">

                        <label>Phone</label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-3">

                        <label>Course</label>

                        <input
                            type="text"
                            name="course"
                            value="BCA"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-3">

                        <label>Semester</label>

                        <select
                            name="semester"
                            class="form-control"
                            required>

                            <option value="1">1st Semester</option>
                            <option value="2">2nd Semester</option>
                            <option value="3">3rd Semester</option>
                            <option value="4">4th Semester</option>
                            <option value="5">5th Semester</option>
                            <option value="6">6th Semester</option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-success">

                        Save Student

                    </button>


                    <a
                        href="/students"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
