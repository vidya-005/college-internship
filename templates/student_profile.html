<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <span class="navbar-brand">
            Student Portal
        </span>

        <a href="/student-dashboard"
           class="btn btn-light">
            Dashboard
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h4 class="mb-0">
                My Profile
            </h4>

        </div>


        <div class="card-body">

            <div class="row mb-3">

                <div class="col-md-4">
                    <strong>USN</strong>
                </div>

                <div class="col-md-8">
                    {{ student.usn }}
                </div>

            </div>


            <div class="row mb-3">

                <div class="col-md-4">
                    <strong>Name</strong>
                </div>

                <div class="col-md-8">
                    {{ student.name }}
                </div>

            </div>


            <div class="row mb-3">

                <div class="col-md-4">
                    <strong>Email</strong>
                </div>

                <div class="col-md-8">
                    {{ student.email }}
                </div>

            </div>


            <div class="row mb-3">

                <div class="col-md-4">
                    <strong>Phone</strong>
                </div>

                <div class="col-md-8">
                    {{ student.phone }}
                </div>

            </div>


            <div class="row mb-3">

                <div class="col-md-4">
                    <strong>Course</strong>
                </div>

                <div class="col-md-8">
                    {{ student.course }}
                </div>

            </div>


            <div class="row mb-3">

                <div class="col-md-4">
                    <strong>Semester</strong>
                </div>

                <div class="col-md-8">
                    {{ student.semester }}
                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
